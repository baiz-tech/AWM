[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "awm"
version = "0.1.0"
description = "Abductive World Modeling (AWM) and the Hierarchical Abductive State Pyramid (HASP)"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black==26.3.1",
    "flake8==7.0.0",
    "isort==5.13.2",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*", "external*", "tools*", "tests*"]
namespaces = true

# ---- style (kept identical to the upstream V-JEPA 2 configuration) ----
[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.flake8]
max-line-length = 119
