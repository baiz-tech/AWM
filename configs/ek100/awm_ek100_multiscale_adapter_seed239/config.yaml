# AWM on EPIC-KITCHENS-100 — multiscale readout + shared temporal adapter
# (paper table "main_results", EK100 column).
#
# Protocol:
#   prepare_indices -> video-disjoint train / probe_validation indices
#   cache           -> frozen encoder tokens at 8x8 spatial resolution
#   train_readout   -> multiscale readout, selected on probe_validation
#   train_adapter   -> shared temporal adapter, selected on probe_validation
#   evaluate        -> verb / noun / action on the official validation split
#
# `final_validation` is the official EPIC-KITCHENS validation split; it is only
# ever used for reporting, never for checkpoint selection.
#
# NOTE: the EK100 dataset is not present on every machine; see
# docs/manual/resource.md.

launch:
  run:
    project: awm
    dataset: ek100
    experiment: awm_ek100_multiscale_adapter_seed239
    stage: 0
    workspace_root: outputs/runs
    data_root: /data/shyang/outputs

  resources:
    gpus_per_node: 8
    cuda_visible_devices: "0,1,2,3,4,5,6,7"
    nnodes: 1
    node_rank: 0
    master_addr: 127.0.0.1
    master_port: 29500

  outputs:
    workspace_output_root: "{workspace_root}/{dataset}/{experiment}/"
    data_output_root: "{data_root}/{project}/{dataset}/{experiment}/"

  extra_config:
    paths:
      ek100_root: /data/shared/datasets/EPIC-KITCHENS-processed_v1
      train_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_train.csv
      validation_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_validation.csv
      encoder_checkpoint: /data/ABDUCTIVE-WORLD/pretrain/checkpoints/vith.pt
    protocol:
      crop_size: 256
      clip_frames: 16
      cache_grid_size: 8
      num_workers: 4

tasks:
  # ------------------------------------------------------------------- indices
  prepare_indices_train:
    launch:
      label: Build video-disjoint EK100 train/probe-validation indices
      module: src.experiments.awm_ek100_multiscale_adapter_seed239.prepare_indices
      distributed: false
      output_mode: both
      existing_output: archive
      background: true
      log_name: prepare_indices_train.log
      pid_name: prepare_indices_train.pid
      args: []
    experiment:
      seed: 239
      cli_defaults:
        --annotations: "{cfg:launch.extra_config.paths.train_annotations}"
        --output: "{large_output_dir}/indices.json"
        --fraction: "0.1"
        --seed: "{seed}"

  prepare_indices_validation:
    launch:
      label: Build the official EK100 validation index file
      module: src.experiments.awm_ek100_multiscale_adapter_seed239.prepare_indices
      distributed: false
      output_mode: both
      existing_output: archive
      background: true
      log_name: prepare_indices_validation.log
      pid_name: prepare_indices_validation.pid
      args: []
    experiment:
      seed: 239
      cli_defaults:
        --annotations: "{cfg:launch.extra_config.paths.validation_annotations}"
        --output: "{large_output_dir}/final_indices.json"
        --fraction: "0.1"
        --seed: "{seed}"

  # -------------------------------------------------------------------- caches
  cache_train:
    launch:
      label: Cache frozen encoder tokens for the EK100 training split
      module: src.experiments.awm_ek100_multiscale_adapter_seed239.cache
      distributed: true
      output_mode: both
      existing_output: archive
      background: true
      log_name: cache_train.log
      pid_name: cache_train.pid
      args: []
    experiment:
      seed: 239
      cli_defaults:
        --config: "{resolved_config}"
        --annotations: "{cfg:launch.extra_config.paths.train_annotations}"
        --indices: "{experiment_root}/prepare_indices_train/indices.json"
        --split: "train"
        --output: "{large_output_dir}"
        --grid-size: "{cfg:launch.extra_config.protocol.cache_grid_size}"
        --batch-size: "4"
      data: &ek100_data
        video_root: /data/shared/datasets/EPIC-KITCHENS-processed_v1
        train_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_train.csv
        validation_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_validation.csv
        crop_size: 256
        clip_frames: 16
        num_workers: 4
      weights: &ek100_weights
        encoder: /data/ABDUCTIVE-WORLD/pretrain/checkpoints/vith.pt
        encoder_key: target_encoder
        native_predictor: null
        predictor_init: random
      predictor_model: &ek100_predictor_model
        model_name: vit_huge
        patch_size: 16
        tubelet_size: 2
        pred_depth: 12
        pred_embed_dim: 384
        pred_num_heads: 12
        num_mask_tokens: 10
        zero_init_mask_tokens: true
        uniform_power: true
        use_rope: true
        use_sdpa: true
        use_silu: false
        use_pred_silu: false
        wide_silu: true
        use_activation_checkpointing: true

  cache_probe_validation:
    launch:
      label: Cache frozen encoder tokens for probe validation
      module: src.experiments.awm_ek100_multiscale_adapter_seed239.cache
      distributed: true
      output_mode: both
      existing_output: archive
      background: true
      log_name: cache_probe_validation.log
      pid_name: cache_probe_validation.pid
      args: []
    experiment:
      seed: 239
      cli_defaults:
        --config: "{resolved_config}"
        --annotations: "{cfg:launch.extra_config.paths.train_annotations}"
        --indices: "{experiment_root}/prepare_indices_train/indices.json"
        --split: "probe_validation"
        --output: "{large_output_dir}"
        --grid-size: "{cfg:launch.extra_config.protocol.cache_grid_size}"
        --batch-size: "4"
      data: *ek100_data
      weights: *ek100_weights
      predictor_model: *ek100_predictor_model

  cache_final_validation:
    launch:
      label: Cache frozen encoder tokens for the official validation split
      module: src.experiments.awm_ek100_multiscale_adapter_seed239.cache
      distributed: true
      output_mode: both
      existing_output: archive
      background: true
      log_name: cache_final_validation.log
      pid_name: cache_final_validation.pid
      args: []
    experiment:
      seed: 239
      cli_defaults:
        --config: "{resolved_config}"
        --annotations: "{cfg:launch.extra_config.paths.validation_annotations}"
        --indices: "{experiment_root}/prepare_indices_validation/final_indices.json"
        --split: "final_validation"
        --output: "{large_output_dir}"
        --grid-size: "{cfg:launch.extra_config.protocol.cache_grid_size}"
        --batch-size: "4"
      data: *ek100_data
      weights: *ek100_weights
      predictor_model: *ek100_predictor_model

  # ------------------------------------------------------------------ readouts
  train_readout:
    launch:
      label: Train the EK100 multiscale readout
      module: src.experiments.awm_ek100_multiscale_adapter_seed239.train_readout
      distributed: true
      output_mode: both
      existing_output: archive
      background: true
      log_name: train_readout.log
      pid_name: train_readout.pid
      resume:
        checkpoint: null
      args: []
    experiment:
      seed: 239
      epochs: 30
      cli_defaults:
        --config: "{resolved_config}"
        --train: "{experiment_root}/cache_train"
        --validation: "{experiment_root}/cache_probe_validation"
        --output: "{large_output_dir}"
        --seed: "{seed}"
        --epochs: "30"
      data:
        train_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_train.csv
        validation_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_validation.csv
      training:
        readout_batch_size: 256
        readout_learning_rate: 0.001

  train_adapter:
    launch:
      label: Train the shared temporal adapter on top of the readout
      module: src.experiments.awm_ek100_multiscale_adapter_seed239.train_adapter
      distributed: true
      output_mode: both
      existing_output: archive
      background: true
      log_name: train_adapter.log
      pid_name: train_adapter.pid
      resume:
        checkpoint: null
      args: []
    experiment:
      seed: 239
      epochs: 12
      cli_defaults:
        --config: "{resolved_config}"
        --train: "{experiment_root}/cache_train"
        --validation: "{experiment_root}/cache_probe_validation"
        --readout: "{experiment_root}/train_readout/best.pt"
        --output: "{large_output_dir}"
        --seed: "{seed}"
        --epochs: "12"
      data:
        train_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_train.csv
        validation_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_validation.csv
      training:
        adapter_batch_size: 8
        adapter_learning_rate: 0.0001
        weight_decay: 0.0001

  # ----------------------------------------------------------------- evaluate
  evaluate:
    launch:
      label: Report verb / noun / action accuracy on official validation
      module: src.experiments.awm_ek100_multiscale_adapter_seed239.evaluate
      distributed: false
      output_mode: both
      existing_output: archive
      background: true
      log_name: evaluate.log
      pid_name: evaluate.pid
      args: []
    experiment:
      seed: 239
      cli_defaults:
        --checkpoint: "{experiment_root}/train_adapter/best.pt"
        --readout: "{experiment_root}/train_readout/best.pt"
        --features: "{experiment_root}/cache_final_validation"
        --output: "{large_output_dir}/metrics.json"
