        "--readout": "{experiment_root}/../awm_ek100_multiscale_adapter_seed239/train_readout/best.pt"
        "--adapter": "{experiment_root}/../awm_ek100_multiscale_adapter_seed239/train_adapter/best.pt"
        "--output": "{experiment_root}/E1"
        "--variant": "E1"
      data:
