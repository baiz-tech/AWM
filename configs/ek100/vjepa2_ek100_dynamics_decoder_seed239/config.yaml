# V-JEPA 2 baseline on EK100 — v5 dynamics decoder + VISOR supervision
#
# Canonical config (docs/manual/requirement.md section 4). The pre-migration
# config is kept verbatim under
#   src/experiments/vjepa2_ek100_dynamics_decoder_seed239/configs_legacy/
#
# Machine-specific paths are recorded in docs/manual/resource.md.
#
# NOTE: the EK100 and VISOR data roots are not present on every machine;
# see docs/manual/resource.md.

launch:
  run:
    project: awm
    dataset: ek100
    experiment: vjepa2_ek100_dynamics_decoder_seed239
    stage: 0
    workspace_root: outputs/runs
    data_root: /data/shyang/outputs

  resources:
    gpus_per_node: 8
    cuda_visible_devices: "0,1,2,3,4,5,6,7"
    nnodes: 1
    node_rank: 0
    master_addr: 127.0.0.1
    master_port: 29500

  outputs:
    workspace_output_root: "{workspace_root}/{dataset}/{experiment}/"
    data_output_root: "{data_root}/{project}/{dataset}/{experiment}/"

  extra_config:
    paths:
      processed_root: /data/shared/datasets/EPIC-KITCHENS-processed_v1
      visor_root: /data/shared/datasets/EPIC-KITCHENS-VISOR-processed_v1
      train_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_train.csv
      validation_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_validation.csv
      encoder_checkpoint: /data/ABDUCTIVE-WORLD/pretrain/checkpoints/vith.pt
      orca_root: /data/shared_model/Orca-4B
      python_bin: /data/shared/envs/vjepa2-312/bin/python
    protocol:
      crop_size: 256
      clip_frames: 16
      event_boundary: midpoint
      minimum_sample_fps: 4.0

tasks:
  train:
    experiment:
      meta:
        seed: 239
        dtype: bfloat16
        pretrain_checkpoint: /data/ABDUCTIVE-WORLD/pretrain/checkpoints/vith.pt
        encoder_checkpoint_key: target_encoder
      model:
        model_name: vit_huge
        patch_size: 16
        tubelet_size: 2
        pred_depth: 12
        pred_embed_dim: 384
        pred_num_heads: 12
        num_mask_tokens: 10
        zero_init_mask_tokens: true
        uniform_power: true
        use_rope: true
        use_sdpa: true
        use_silu: false
        use_pred_silu: false
        wide_silu: true
        use_activation_checkpointing: true
      data:
        dataset: epic100_visor
        processed_root: /data/shared/datasets/EPIC-KITCHENS-processed_v1
        visor_root: /data/shared/datasets/EPIC-KITCHENS-VISOR-processed_v1
        train_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_train.csv
        validation_annotations: /data/shared/datasets/EPIC-KITCHENS-processed_v1/annotations/EPIC_100_validation.csv
        crop_size: 256
        clip_frames: 16
        event_boundary: midpoint
  prepare_targets:
    launch:
      label: Build EK100 event targets
      module: src.experiments.vjepa2_ek100_dynamics_decoder_seed239.scripts.epic100.prepare_targets
      distributed: true
      output_mode: both
      existing_output: archive
      background: true
      log_name: prepare_targets.log
      pid_name: prepare_targets.pid
      args: []
    experiment:
      cli_defaults:
        "--processed-root": "{cfg:launch.extra_config.paths.processed_root}"
        "--visor-root": "{cfg:launch.extra_config.paths.visor_root}"
        "--annotations": "{cfg:launch.extra_config.paths.validation_annotations}"
        "--train-annotations": "{cfg:launch.extra_config.paths.train_annotations}"
        "--split": "validation"
        "--output": "{large_output_dir}/targets.pt"
      seed: 239

  cache_latents:
    launch:
      label: Cache frozen context/predicted-future latents
      module: src.experiments.vjepa2_ek100_dynamics_decoder_seed239.scripts.epic100.cache_full_latents
      distributed: true
      output_mode: both
      existing_output: archive
      background: true
      log_name: cache_full_latents.log
      pid_name: cache_full_latents.pid
      args: []
    experiment:
      cli_defaults:
        "--config": "{resolved_config}"
        "--targets": "{experiment_root}/prepare_targets/targets.pt"
        "--output-dir": "{large_output_dir}"
      seed: 239

  train_decoder:
    launch:
      label: Train the EK100 dynamics decoder
      module: src.experiments.vjepa2_ek100_dynamics_decoder_seed239.scripts.epic100.train_decoder
      distributed: true
      output_mode: both
      existing_output: archive
      background: true
      log_name: train_decoder.log
      pid_name: train_decoder.pid
      resume:
        checkpoint: null
      args: []
    experiment:
      cli_defaults:
        "--config": "{resolved_config}"
        "--train-cache": "{experiment_root}/cache_latents/train"
        "--validation-cache": "{experiment_root}/cache_latents/validation"
        "--train-targets": "{experiment_root}/prepare_targets/targets.pt"
        "--validation-targets": "{experiment_root}/prepare_targets/targets.pt"
        "--output-dir": "{large_output_dir}"
      seed: 239

  evaluate_decoder:
    launch:
      label: Evaluate the EK100 dynamics decoder
      module: src.experiments.vjepa2_ek100_dynamics_decoder_seed239.scripts.epic100.evaluate_decoder
      distributed: false
      output_mode: both
      existing_output: archive
      background: true
      log_name: evaluate_decoder.log
      pid_name: evaluate_decoder.pid
      args: []
    experiment:
      cli_defaults:
        "--cache": "{experiment_root}/cache_latents/validation"
        "--targets": "{experiment_root}/prepare_targets/targets.pt"
        "--checkpoint": "{experiment_root}/train_decoder/best.pt"
        "--output": "{large_output_dir}/metrics.json"
      seed: 239

