protocol: joint_oracle
seed: 239

model:
  checkpoint: /data/shared/models/videomae-v2/distill/vit_b_k710_dl_from_giant.pth
  official_repo: recipe/src.experiments/VideoMAE2/repo
  model_name_or_path: null
  architecture: vit_b
  local_files_only: true
  freeze_encoder: true
  remove_cls_token: false

data:
  root: /data/ABDUCTIVE-WORLD/physion_v2/extracted
  train_split: data_v1
  readout_split: readout_data_v1
  test_split: testdata_v1
  clip_frames: 16
  current_frame_step: 2
  future_frame_step: 4
  clip_gap: 0
  input_size: 224
  batch_size: 4
  num_workers: 4

readout:
  hidden_dim: 256
  dropout: 0.1
  epochs: 20
  lr: 0.0001
  weight_decay: 0.01
