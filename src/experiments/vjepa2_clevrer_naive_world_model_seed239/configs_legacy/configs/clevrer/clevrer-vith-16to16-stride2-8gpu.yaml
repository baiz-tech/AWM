launch:
  run:
    project: vjepa2-baiz
    experiment: vjepa2_naive
    name: clevrer_vith_16to16_stride2_8gpu
    workspace_root: outputs/runs
    data_root: /data/shyang/outputs
  resources:
    gpus: 8
    cuda_visible_devices: 0,1,2,3,4,5,6,7
    master_addr: 127.0.0.1
    master_port: 29518
  outputs: {}
tasks:
  train:
    launch:
      module: src.experiments.vjepa2_clevrer_naive_world_model_seed239.train
      distributed: true
      output_scope: run
      log_name: train.log
      pid_name: train.pid
      label: Training
      mirror_data_to_workspace: false
      args:
      - --config
      - '{config}'
    experiment:
      meta:
        seed: 239
        dtype: bfloat16
        pretrain_checkpoint: /data/ABDUCTIVE-WORLD/pretrain/checkpoints/vith.pt
        encoder_checkpoint_key: target_encoder
        save_every_freq: 5
      protocol:
        name: clevrer_current16_stride2_to_future16_stride2
        require:
          clip_frames: 16
          current_frame_step: 2
          future_frame_step: 2
          clip_gap: 0
          train_num_future_chunks: 1
      model:
        model_name: vit_huge
        patch_size: 16
        tubelet_size: 2
        pred_depth: 12
        pred_embed_dim: 384
        pred_num_heads: 12
        num_mask_tokens: 1
        zero_init_mask_tokens: true
        uniform_power: true
        use_rope: true
        use_sdpa: true
        use_silu: false
        use_pred_silu: false
        wide_silu: true
        use_activation_checkpointing: true
      data:
        dataset: clevrer
        root: /data/shared/datasets/CLEVRER
        train_split: train
        eval_split: validation
        video_glob: '*.mp4'
        crop_size: 256
        clip_frames: 16
        sampling_mode: random
        current_frame_step: 2
        future_frame_step: 2
        clip_gap: 0
        train_num_future_chunks: 1
        eval_num_future_chunks: 1
        batch_size: 4
        eval_batch_size: 4
        num_workers: 4
        pin_mem: true
        persistent_workers: true
        max_train_videos: null
        max_eval_videos: 256
      data_aug:
        horizontal_flip: true
        random_resize_aspect_ratio:
        - 0.9
        - 1.1
        random_resize_scale:
        - 0.8
        - 1.0
        auto_augment: false
        motion_shift: false
        reprob: 0.0
      loss:
        type: l1
      optimization:
        epochs: 25
        ipe: null
        start_lr: 2.0e-05
        lr: 0.0002
        final_lr: 1.0e-05
        warmup: 0.05
        weight_decay: 0.04
        betas:
        - 0.9
        - 0.999
        eps: 1.0e-08
        grad_clip: 1.0
      logging:
        log_freq: 10
        max_eval_batches: 64
  qa_eval:
    experiment:
      evaluation:
        world_model_adapter: src.experiments.vjepa2_clevrer_naive_world_model_seed239.world_model_adapter
      qa:
        backend: native_aloe
        protocol: compatibility_stride2
        data:
          token_source: online
          future_generation: rollout
        representation:
          type: global_tokens
          layout: BTND
          num_slots: 4
          feature_dim: 1280
        temporal:
          trajectory_length: 80
          frame_offset: 5
          predictive_window: true
        annotation_root: /data/shared/datasets/CLEVRER/official_code/executor/data
        question_types:
        - predictive
        skip_existing_trajectories: true
        archive_existing_probe_outputs: true
        spatial_pool_grid: 2
        export_batch_size: 2
        export_num_workers: 4
        video_len: 128
        n_sample_frames: 25
        max_n_objects: 7
        max_visual_tokens: 7
        max_question_len: 20
        max_choice_len: 12
        scene_batch_size: 96
        train_batch_size: 96
        val_batch_size: 192
        num_workers: 4
        min_token_frequency: 1
        input_dim: 16
        num_layers: 12
        num_heads: 8
        ffn_dim: 512
        cls_mlp_size: 128
        dropout: 0.1
        epochs: 400
        learning_rate: 0.001
        weight_decay: 0.0
        grad_clip: 1.0
    launch:
      name: qa_naive
      module: src.shared.evaluate.clevrer.qa_pipeline
      output_scope: evaluation
      log_name: pipeline.log
      pid_name: pipeline.pid
      label: CLEVRER QA pipeline
      archive_existing: true
      preserve_on_archive:
      - qa_trajectories
      mirror_data_to_workspace: false
      args:
      - --config
      - '{config}'
      - --workspace-run-dir
      - '{workspace_run_dir}'
      - --data-run-dir
      - '{data_run_dir}'
      - --workspace-output-dir
      - '{workspace_output_dir}'
      - --data-output-dir
      - '{data_output_dir}'
      - --world-checkpoint
      - '{checkpoint}'
      - --base-port
      - '{base_port}'
      - --master-addr
      - '{master_addr}'
      - --num-gpus
      - '{num_gpus}'
      - --python-bin
      - '{python_bin}'
      launcher:
        gpus: 8
        cuda_visible_devices: 0,1,2,3,4,5,6,7
        master_addr: 127.0.0.1
        base_port: 29530
